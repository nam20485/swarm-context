# Must scan clean: interpolation, placeholders, booleans, non-secret keys.
services:
  db:
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: llmproxy
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      RETRY_COUNT: 3
  app:
    environment:
      DATABASE_URL: "postgresql://llmproxy:${DB_PASS}@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      DEBUG_ENABLED: "false"
      SOME_SECRET_FLAG: "true"
      API_KEY: "changeme"
      BEARER_TOKEN: "<YOUR_TOKEN>"
